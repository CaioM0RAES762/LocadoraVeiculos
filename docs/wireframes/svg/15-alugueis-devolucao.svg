<text x="62" y="917" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">A janela carrega o aluguel por GET /api/Alugueis/{id}; a data sugerida é o momento atual e a quilometragem parte da inicial.</text>
