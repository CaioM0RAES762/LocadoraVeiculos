<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Estados: carregando, vazio, erro e avisos">
<title>Estados: carregando, vazio, erro e avisos</title>
<rect x="0" y="0" width="1440" height="1400" rx="0" fill="#fff" stroke="none" stroke-width="1" opacity="1"/>
<rect x="0" y="0" width="1440" height="860" rx="0" fill="#eceff1" stroke="none" stroke-width="1" opacity="1"/>
<text x="40" y="56" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#263238" text-anchor="start">Estados de interface</text>
<text x="40" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#607d8b" text-anchor="start">Todos os componentes de lista e formulário compartilham estes padrões.</text>
<rect x="40" y="120" width="660" height="320" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1" opacity="1"/>
<text x="64" y="156" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#607d8b" text-anchor="start">Carregando</text>
<rect x="740" y="120" width="660" height="320" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1" opacity="1"/>
<text x="764" y="156" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#607d8b" text-anchor="start">Lista vazia</text>
<rect x="40" y="480" width="660" height="320" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1" opacity="1"/>
<text x="64" y="516" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#607d8b" text-anchor="start">Erro de comunicação</text>
<rect x="740" y="480" width="660" height="320" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1" opacity="1"/>
<text x="764" y="516" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#607d8b" text-anchor="start">Avisos (toasts)</text>
<circle cx="370" cy="270" r="22" fill="none" stroke="#cfe3e8" stroke-width="5"/>
<path d="M370 248 A22 22 0 0 1 392 270" fill="none" stroke="#0b5563" stroke-width="5" stroke-linecap="round"/>
<text x="370" y="330" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#607d8b" text-anchor="middle">Carregando veículos…</text>
<text x="1070" y="250" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#263238" text-anchor="middle">Nenhum veículo encontrado</text>
<text x="1070" y="280" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#607d8b" text-anchor="middle">Ajuste ou limpe os filtros para ver outros resultados.</text>
<rect x="1010" y="306" width="120" height="40" rx="8" fill="#fff" stroke="#90a4ae" stroke-width="1" opacity="1"/>
<text x="1070" y="331" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#263238" text-anchor="middle">Limpar filtros</text>
<text x="370" y="600" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#b42318" text-anchor="middle">Não foi possível carregar os dados</text>
<text x="370" y="630" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#b42318" text-anchor="middle">Não foi possível conectar à API. Verifique se o servidor está em execução e tente novamente.</text>
<rect x="300" y="660" width="140" height="40" rx="8" fill="#fff" stroke="#90a4ae" stroke-width="1" opacity="1"/>
<text x="370" y="685" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#263238" text-anchor="middle">↩  Tentar novamente</text>
<rect x="770" y="540" width="600" height="52" rx="10" fill="#14532d" stroke="none" stroke-width="1" opacity="1"/>
<text x="792" y="572" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#fff" text-anchor="start">✓  Fabricante “Honda” cadastrado com sucesso.</text>
<rect x="770" y="606" width="600" height="52" rx="10" fill="#991b1b" stroke="none" stroke-width="1" opacity="1"/>
<text x="792" y="638" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#fff" text-anchor="start">!  Não é possível excluir o fabricante: existem veículos vinculados.</text>
<rect x="770" y="672" width="600" height="100" rx="8" fill="#ffebee" stroke="#f3b4b4" stroke-width="1" opacity="1"/>
<rect x="770" y="672" width="5" height="100" rx="0" fill="#b42318" stroke="none" stroke-width="1" opacity="1"/>
<text x="792" y="700" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b42318" text-anchor="start">Corrija os itens abaixo para continuar:</text>
<text x="792" y="724" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#b42318" text-anchor="start">•  O nome do fabricante é obrigatório.</text>
<text x="792" y="744" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#b42318" text-anchor="start">•  O CPF deve conter exatamente 11 dígitos numéricos.</text>
<circle cx="700" cy="138" r="12" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="700" y="143" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#263238" text-anchor="middle">1</text>
<circle cx="1380" cy="138" r="12" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="1380" y="143" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#263238" text-anchor="middle">2</text>
<circle cx="700" cy="498" r="12" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="700" y="503" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#263238" text-anchor="middle">3</text>
<circle cx="1380" cy="498" r="12" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="1380" y="503" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#263238" text-anchor="middle">4</text>
<rect x="0" y="860" width="1440" height="140" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" opacity="1"/>
<line x1="0" y1="860" x2="1440" y2="860" stroke="#90a4ae" stroke-width="1"/>
<text x="32" y="888" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#607d8b" text-anchor="start">NOTAS DA TELA</text>
<circle cx="42" cy="912" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="916" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">1</text>
<text x="62" y="917" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Carregando: indicador com role=status enquanto a API responde.</text>
<circle cx="42" cy="936" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="940" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">2</text>
<text x="62" y="941" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Vazio: mensagem explicativa e ação para limpar filtros ou cadastrar o primeiro registro.</text>
<circle cx="42" cy="960" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="964" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">3</text>
<text x="62" y="965" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Erro: API indisponível, falha de rede, 400, 404, 409 e 500 viram mensagens compreensíveis, com botão para tentar novamente.</text>
<circle cx="42" cy="984" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="988" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">4</text>
<text x="62" y="989" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Avisos de sucesso/erro (aria-live) e resumo de erros de validação nos formulários.</text>
</svg>
