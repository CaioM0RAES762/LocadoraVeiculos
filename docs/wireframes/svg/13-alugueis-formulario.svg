<text x="42" y="916" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">1</text>
<text x="62" y="917" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Em um novo aluguel, o select de veículos usa GET /api/Veiculos/filtro/disponiveis; ao editar, lista todos os veículos.</text>
<circle cx="42" cy="936" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="940" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">2</text>
<text x="62" y="941" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">A quilometragem inicial acompanha o veículo escolhido; as regras de datas e quilometragens espelham a validação da API.</text>
<circle cx="42" cy="960" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="964" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">3</text>
<text x="62" y="965" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">A estimativa é apenas visual e identificada como tal: o valor oficial (ValorTotal) é calculado e devolvido pela API.</text>
