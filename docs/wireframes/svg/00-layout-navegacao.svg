<text x="32" y="888" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#607d8b" text-anchor="start">NOTAS DA TELA</text>
<circle cx="42" cy="912" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="916" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">1</text>
<text x="62" y="917" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Menu lateral fixo com as cinco entidades e o painel; em telas estreitas vira um menu recolhível com botão.</text>
<circle cx="42" cy="936" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="940" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">2</text>
<text x="62" y="941" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Trilha de navegação (breadcrumb) e título da página; o foco do teclado vai para a área principal ao trocar de tela.</text>
<circle cx="42" cy="960" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="964" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">3</text>
<text x="62" y="965" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Ação principal da tela (cadastro). Todas as telas seguem o mesmo padrão de botões primário, secundário e de perigo.</text>
<circle cx="42" cy="984" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="988" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">4</text>
<text x="62" y="989" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Abas escolhem o tipo de consulta: filtros combinados ou uma das consultas SQL com rota própria na API.</text>
<circle cx="42" cy="1008" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="1012" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">5</text>
<text x="62" y="1013" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Barra de filtros (ao menos dois campos por entidade); o estado dos filtros fica na URL e sobrevive ao recarregamento.</text>
<circle cx="42" cy="1032" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="1036" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">6</text>
<text x="62" y="1037" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Resultados vindos da API/SQL Server, com a rota consultada e o total de registros exibidos acima da tabela.</text>
