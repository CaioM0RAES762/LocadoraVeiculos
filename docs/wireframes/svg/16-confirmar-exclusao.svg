<rect x="468" y="158" width="360" height="42" rx="8" fill="#fff" stroke="#90a4ae" stroke-width="1" opacity="1"/>
<rect x="1218" y="158" width="100" height="40" rx="8" fill="#0b5563" stroke="#0b5563" stroke-width="1" opacity="1"/>
<text x="1268" y="183" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Filtrar</text>
<rect x="1326" y="158" width="66" height="40" rx="8" fill="#fff" stroke="#90a4ae" stroke-width="1" opacity="1"/>
<text x="1359" y="183" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#263238" text-anchor="middle">Limpar</text>
<rect x="272" y="244" width="1136" height="200" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1" opacity="1"/>
<rect x="0" y="0" width="1440" height="860" rx="0" fill="#0b1f26" stroke="none" stroke-width="1" opacity="0.62"/>
<rect x="440" y="260" width="560" height="250" rx="14" fill="#fff" stroke="none" stroke-width="1" opacity="1"/>
<text x="468" y="306" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#263238" text-anchor="start">Excluir fabricante?</text>
<text x="468" y="344" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#607d8b" text-anchor="start">Deseja realmente excluir o fabricante “Fiat”? Esta ação não pode ser desfeita.</text>
<rect x="468" y="430" width="100" height="40" rx="8" fill="#fff" stroke="#90a4ae" stroke-width="1" opacity="1"/>
<text x="518" y="455" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#263238" text-anchor="middle">Cancelar</text>
<rect x="580" y="430" width="120" height="40" rx="8" fill="#fff" stroke="#b42318" stroke-width="1" opacity="1"/>
<text x="640" y="455" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#b42318" text-anchor="middle">Excluir</text>
<rect x="468" y="384" width="504" height="34" rx="8" fill="#ffebee" stroke="none" stroke-width="1" opacity="1"/>
<text x="480" y="406" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#b42318" text-anchor="start">Se houver veículos vinculados, a API responde 409 e a mensagem é exibida.</text>
<circle cx="740" cy="290" r="12" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="740" y="295" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#263238" text-anchor="middle">1</text>
<rect x="0" y="860" width="1440" height="92" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" opacity="1"/>
<line x1="0" y1="860" x2="1440" y2="860" stroke="#90a4ae" stroke-width="1"/>
<text x="32" y="888" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#607d8b" text-anchor="start">NOTAS DA TELA</text>
<circle cx="42" cy="912" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="916" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">1</text>
<text x="62" y="917" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Toda exclusão (nas cinco entidades) passa por esta confirmação, com o foco inicial em “Cancelar” e fechamento por Esc.</text>
<circle cx="42" cy="936" r="9" fill="#f2994a" stroke="none" stroke-width="1"/>
<text x="42" y="940" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#263238" text-anchor="middle">2</text>
<text x="62" y="941" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#263238" text-anchor="start">Sucesso: aviso verde e lista atualizada. Conflito (409): aviso vermelho com a mensagem da API, sem alterar os dados.</text>
</svg>
